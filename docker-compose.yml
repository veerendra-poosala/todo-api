# Run the API with a SQLite file database:  docker compose up --build
# No database container is needed; the .db file lives in a named volume.
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////code/data/todosapp.db
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/code/data

volumes:
  sqlite_data:
