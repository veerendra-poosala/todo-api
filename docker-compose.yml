# Run the API + MongoDB together:  docker compose up --build
# Only MongoDB (e.g. for running tests locally):  docker compose up -d mongo
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: on-failure
    env_file: .env
    environment:
      # Inside the compose network the database host is the service name "mongo"
      MONGODB_URL: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
