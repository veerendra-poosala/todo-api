# Run the API + SQL Server together:  docker compose up --build
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}
    ports:
      - "1434:1433"   # host 1434 so it doesn't clash with a locally installed SQL Server
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # -C trusts the container's self-signed certificate (sqlcmd 18 encrypts by default)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Unlike the MySQL/Postgres images, SQL Server has no "create this database on first start"
  # variable, so a one-shot container creates it before the API runs its migrations.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-todoapplication}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P "$$MSSQL_SA_PASSWORD"
        -Q "IF DB_ID('$$MSSQL_DATABASE') IS NULL CREATE DATABASE [$$MSSQL_DATABASE]"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: on-failure
    env_file: .env
    environment:
      # Inside the compose network the database host is the service name "db"
      DATABASE_URL: mssql+pyodbc://sa:${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}@db:1433/${MSSQL_DATABASE:-todoapplication}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  mssql_data:
